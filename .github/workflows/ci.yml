name: ci

on:
  push:
    branches: [master, v2, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  frontend:
    name: Frontend and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            runtime/package-lock.json
            tools/component-check/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix runtime
          npm ci --prefix tools/component-check

      - name: Check and rebuild embedded runtime
        run: |
          npm run check --prefix runtime
          npm run build --prefix runtime
          git diff --exit-code -- runtime/dist

      - name: Check generated contracts and v2-only migration
        run: |
          node tools/contracts/generate.mjs --check
          node tools/validation/v2-only.mjs

      - name: Check frontend formatting, i18n, components and types
        run: |
          npm run format:check --prefix frontend
          npm run check:contracts --prefix frontend
          npm run check:i18n --prefix frontend
          npm run check:components --prefix frontend
          npm run typecheck --prefix frontend
          npm run knip --prefix frontend

      - name: Run frontend unit tests
        run: npm test --prefix frontend

      - name: Build and check frontend budget
        run: |
          npm run build --prefix frontend
          npm run check:budget --prefix frontend

  linux:
    name: Linux native, browser and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libgtk-3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            runtime/package-lock.json

      # Debug Rust tests serve frontend/dist directly, so build it FIRST.
      - name: Build frontend and embedded plugin runtime
        run: |
          npm ci --prefix frontend
          npm ci --prefix runtime
          npm run build --prefix runtime
          npm run build --prefix frontend

      - name: Rust formatting and Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust unit and integration tests
        run: cargo test --locked --all-targets

      - name: Test native plugin process isolation
        env:
          WEBDECK_TRUSTED_FIXTURE: target/debug/examples/trusted-plugin
        run: |
          cargo build --locked --example trusted-plugin
          cargo test --locked --test runtime trusted_process_fixture -- --ignored

      - name: Build real debug host for browser/runtime tests
        run: cargo build --locked --bin webdeck

      - name: Install Chromium, Firefox and WebKit for browser coverage
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Desktop browser acceptance
        run: npm run test:acceptance --prefix frontend

      - name: Phone, tablet and Firefox browser emulation
        run: npm run test:devices --prefix frontend

      - name: Verify embedded runtime and redacted diagnostics
        run: |
          node tools/validation/runtime.mjs
          node tools/validation/diagnostics.mjs

      - name: Build development portable ZIP and Debian package
        run: |
          cargo run --locked --bin package -- --dev
          node tools/release/installers.mjs --dev

      - name: Validate extracted portable and installed Debian payload
        shell: bash
        env:
          WEBDECK_PORTABLE_OUTPUT: dist/portable-report.json
        run: |
          set -euo pipefail
          portable=$(find dist -maxdepth 1 -name '*-dev-portable.zip' -print -quit)
          deb=$(find dist -maxdepth 1 -name '*-dev.deb' -print -quit)
          test -n "$portable" && test -n "$deb"
          node tools/validation/portable.mjs "$portable"
          node tools/validation/installer.mjs "$deb"
          cargo test --locked --test v2_update portable_archive -- --ignored

      - name: Upload Linux artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: preliminary-linux
          path: |
            dist/
            frontend/test-results/
            frontend/device-report/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Linux failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-failure-reports
          path: |
            frontend/test-results/
            frontend/device-report/
            dist/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows native, browser and packaging
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            runtime/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Debug Rust tests read frontend/dist/index.html on disk.
      - name: Build frontend and embedded plugin runtime
        run: |
          npm ci --prefix frontend
          npm ci --prefix runtime
          npm run build --prefix runtime
          npm run build --prefix frontend

      - name: Windows Rust Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Windows Rust unit and integration tests
        run: cargo test --locked --all-targets

      - name: Test native plugin process isolation
        env:
          WEBDECK_TRUSTED_FIXTURE: target/debug/examples/trusted-plugin.exe
        run: |
          cargo build --locked --example trusted-plugin
          cargo test --locked --test runtime trusted_process_fixture -- --ignored

      - name: Build real Windows host
        run: cargo build --locked --bin webdeck

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Windows browser acceptance
        run: npm run test:acceptance --prefix frontend

      - name: Verify embedded runtime and redacted diagnostics
        run: |
          node tools/validation/runtime.mjs
          node tools/validation/diagnostics.mjs

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          "WEBDECK_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build development portable ZIP and Windows setup
        run: |
          cargo run --locked --bin package -- --dev
          node tools/release/installers.mjs --dev

      - name: Validate portable ZIP and installed Windows payload
        shell: bash
        env:
          WEBDECK_PORTABLE_OUTPUT: dist/portable-report.json
        run: |
          set -euo pipefail
          portable=$(find dist -maxdepth 1 -name '*-dev-portable.zip' -print -quit)
          installer=$(find dist -maxdepth 1 -name '*-dev-setup.exe' -print -quit)
          test -n "$portable" && test -n "$installer"
          node tools/validation/portable.mjs "$portable"
          node tools/validation/installer.mjs "$installer"

      - name: Upload Windows artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: preliminary-windows
          path: |
            dist/
            frontend/test-results/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-failure-reports
          path: |
            frontend/test-results/
            dist/
          if-no-files-found: ignore
          retention-days: 7
