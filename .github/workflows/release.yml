name: Release WebDeck

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example, v2.0.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and project versions
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a SemVer tag such as v2.0.0-alpha.1"
            exit 1
          fi

          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [[ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Checkout does not match $RELEASE_TAG"
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          RELEASE_VERSION="$VERSION" python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          with Path("Cargo.toml").open("rb") as f:
              cargo_version = tomllib.load(f)["package"]["version"]
          frontend_version = json.loads(
              Path("frontend/package.json").read_text(encoding="utf-8")
          )["version"]
          release_versions = {
              entry["version"]
              for entry in json.loads(
                  Path("webdeck/version.json").read_text(encoding="utf-8")
              )["versions"]
          }

          if cargo_version != version or frontend_version != version or version not in release_versions:
              raise SystemExit(
                  f"Version mismatch: tag={version}, cargo={cargo_version}, "
                  f"frontend={frontend_version}, version.json={sorted(release_versions)}"
              )
          PY

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build / ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Install Linux development libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev libgtk-3-dev \
            libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Ensure Inno Setup 6 is installed
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Unable to install Inno Setup" }
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }
          "WEBDECK_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            runtime/package-lock.json

      - name: Install JavaScript build dependencies
        run: |
          npm ci --prefix runtime
          npm ci --prefix frontend

      - name: Build embedded plugin runtime
        run: npm run build --prefix runtime

      - name: Package optimized portable ZIP
        run: cargo run --locked --release --bin package --

      - name: Build native installer
        run: node tools/release/installers.mjs

      - name: Install Chromium for packaged-app checks (Linux)
        if: matrix.platform == 'linux'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Chromium for packaged-app checks (Windows)
        if: matrix.platform == 'windows'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Validate portable application and installer
        shell: bash
        env:
          WEBDECK_PORTABLE_OUTPUT: dist/portable-report.json
        run: |
          set -euo pipefail
          portable="$(find dist -maxdepth 1 -name '*-portable.zip' -print -quit)"
          if [[ -z "$portable" ]]; then
            echo "::error::Missing portable ZIP"
            exit 1
          fi
          node tools/validation/portable.mjs "$portable"

          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            installer="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          else
            installer="$(find dist -maxdepth 1 -name '*-setup.exe' -print -quit)"
          fi
          if [[ -z "$installer" ]]; then
            echo "::error::Missing native installer"
            exit 1
          fi
          node tools/validation/installer.mjs "$installer"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webdeck-${{ matrix.platform }}-${{ needs.validate.outputs.tag }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          path: |
            dist/*-portable.zip
            dist/*-portable.zip.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux and Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: webdeck-*-${{ needs.validate.outputs.tag }}
          path: dist
          merge-multiple: true

      - name: Verify all packages and SHA-256 checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          for name in \
            "WebDeck-${VERSION}-linux-x86_64-portable.zip" \
            "WebDeck-${VERSION}-linux-x86_64.deb" \
            "WebDeck-${VERSION}-windows-x86_64-portable.zip" \
            "WebDeck-${VERSION}-windows-x86_64-setup.exe"
          do
            test -s "dist/$name" || { echo "::error::Missing $name"; exit 1; }
            test -s "dist/$name.sha256" || { echo "::error::Missing $name.sha256"; exit 1; }
          done

          (cd dist && sha256sum --check ./*.sha256)

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: WebDeck ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*-portable.zip
            dist/*-portable.zip.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
